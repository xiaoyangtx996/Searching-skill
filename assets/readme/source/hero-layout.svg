<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">Searching-skill · 网络迷踪判读规则库</title>
  <desc id="desc">发一张照片，按可见线索路由到元素与区域规则，再做核验定位。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1424"/>
      <stop offset="55%" stop-color="#101C30"/>
      <stop offset="100%" stop-color="#16263A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#243448" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="48%" r="38%">
      <stop offset="0%" stop-color="#4EC8B8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4EC8B8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="28" fill="url(#grid)" opacity="0.45"/>
  <rect width="1200" height="380" rx="28" fill="url(#glow)"/>

  <g stroke="#4EC8B8" stroke-opacity="0.35" fill="none">
    <circle cx="980" cy="190" r="86" stroke-width="1.2"/>
    <circle cx="980" cy="190" r="54" stroke-width="1"/>
    <path d="M980 88V292M876 190H1084" stroke-width="1"/>
  </g>
  <circle cx="980" cy="190" r="5" fill="#F0A33A"/>

  <g id="title-block" transform="translate(56 48)"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
     fill="#F4F1E8">
    <text x="0" y="22" font-size="18" letter-spacing="2.4" fill="#8B95A8">GEOLOCATION RULEBASE</text>
    <text x="0" y="78" font-size="46" font-weight="700">Searching-skill</text>
    <text x="0" y="118" font-size="28" font-weight="600" fill="#4EC8B8">网络迷踪判读规则库</text>
    <text x="0" y="168" font-size="20" fill="#D7DCE6">发一张照片 → 提线索 → 路由领域/区域 → 核验定位</text>
    <text x="0" y="200" font-size="18" fill="#8B95A8">元素层「这是什么」· 区域层「这里是哪」· geo-sleuth 核验</text>

    <g transform="translate(0 232)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <rect width="148" height="54" rx="12" fill="#152235" stroke="#2B3E56"/>
      <text x="18" y="24" font-size="16" fill="#F0A33A">24,725</text>
      <text x="18" y="44" font-size="13" fill="#8B95A8">rules</text>

      <rect x="164" width="148" height="54" rx="12" fill="#152235" stroke="#2B3E56"/>
      <text x="182" y="24" font-size="16" fill="#4EC8B8">24</text>
      <text x="182" y="44" font-size="13" fill="#8B95A8">domains</text>

      <rect x="328" width="148" height="54" rx="12" fill="#152235" stroke="#2B3E56"/>
      <text x="346" y="24" font-size="16" fill="#F4F1E8">161+</text>
      <text x="346" y="44" font-size="13" fill="#8B95A8">regions</text>
    </g>
  </g>

  <g id="subject-slot">
    <rect x="760" y="36" width="380" height="308" rx="20"
          fill="none" stroke="#243448" stroke-dasharray="6 6" opacity="0.35"/>
  </g>
</svg>
